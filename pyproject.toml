[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multicrisis"
version = "1.0.0"
description = "Compound security–climate vulnerability assessment framework for desalination-dependent water systems"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Karol Bot", email = "kbot.consulting@gmail.com"},
    {name = "Natalie De Falco", email = "defalco@bgu.ac.il"},
]
keywords = ["water-systems", "compound-hazards", "scenario-analysis", "monte-carlo", "deep-uncertainty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.0,<3.0",
    "scipy>=1.13,<2.0",
    "matplotlib>=3.7,<4.0",
]

[project.urls]
"Manuscript" = "https://doi.org/PLACEHOLDER-TO-BE-FILLED-ON-PUBLICATION"

[tool.setuptools.packages.find]
include = ["multicrisis*"]
exclude = ["scripts*", "data*", "docs*", "results*", "tests*"]
